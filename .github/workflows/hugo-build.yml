name: Hugo Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Set up Hugo (extended version)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.145.0'
          extended: true

      # ✅ Build your Hugo site
      - name: Build Hugo site
        run: |
          hugo --minify --verbose
          if [ ! -d "public" ]; then
            echo "Build failed - public directory not created"
            exit 1
          fi

      # ✅ Set up SSH agent with your deploy key
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # ✅ Add your server to known_hosts to avoid prompt
      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      # ✅ Optional: Backup existing site before deploy
      - name: 🛡️ Backup existing site
        run: |
          ssh ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
          'cp -r ~/45.calgaryaikikai.com ~/45.backup.$(date +%Y%m%d-%H%M%S)'

      # ✅ Deploy site with rsync
      - name: 🚀 Deploy site with rsync
        run: |
          rsync -avz --delete ./public/ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:~/45.calgaryaikikai.com
